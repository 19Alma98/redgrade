[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redgrade"
dynamic = ["version"]
description = "Attack your AI agent before you release it: built-in, generated and adaptive attacks through its chat API, findings with fixes, a release verdict, and a deterministic gate for CI."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Alessandro Magliola" }]
keywords = ["llm", "security", "red-teaming", "prompt-injection", "owasp", "mcp", "agents", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2",
    "httpx2",
    # The attacker and judge LLMs of `scan` (any provider). Imported lazily: `check` in CI never loads it.
    "litellm>=1.109.1",
]

[project.optional-dependencies]
opengrade = ["opengrade-ai>=0.1"]
# Kept so `pip install 'redgrade[deep]'` keeps working: LiteLLM is now a core dependency.
deep = []

[project.scripts]
redgrade = "redgrade.cli:main"

[project.entry-points.pytest11]
redgrade = "redgrade.pytest_plugin"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6.0"]

[tool.hatch.version]
path = "src/redgrade/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/redgrade"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "examples"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"examples/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["redgrade"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["opengrade", "opengrade.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["redgrade.integrations.opengrade"]
disable_error_code = ["untyped-decorator", "no-any-return"]
