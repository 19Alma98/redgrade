[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redgrade"
version = "0.2.0"
description = "Red-team your LLM app in CI: attack it, measure the attack success rate, fail the pull request on regressions."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Alessandro Magliola" }]
keywords = ["llm", "security", "red-teaming", "prompt-injection", "owasp", "mcp", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["pyyaml>=6.0", "pydantic>=2", "httpx2"]

[project.optional-dependencies]
opengrade = ["opengrade-ai>=0.1"]

[project.scripts]
redgrade = "redgrade.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "types-PyYAML>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/redgrade"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "examples"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"examples/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["redgrade"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["opengrade", "opengrade.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["redgrade.integrations.opengrade"]
disable_error_code = ["untyped-decorator", "no-any-return"]
